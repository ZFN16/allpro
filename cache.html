<body>
<div class="cache-screen" aria-live="polite">
  <div id="progress">Cache sedang dibuat...</div>
</div>

<script>
(function () {
  var progress = document.getElementById("progress");
  var appCache = window.applicationCache;

  function goBackToIndex() {
    window.location.replace("index.html");
  }

  if (!appCache) {
    progress.textContent = "Cache sedang dibuat...";
    setTimeout(goBackToIndex, 1000);
    return;
  }

  appCache.addEventListener("cached", goBackToIndex, false);
  appCache.addEventListener("updateready", goBackToIndex, false);

  appCache.addEventListener("error", function () {
    progress.textContent = "Cache gagal dibuat. Silakan muat ulang halaman.";
  }, false);

  appCache.addEventListener("obsolete", function () {
    progress.textContent = "Cache tidak tersedia. Silakan muat ulang halaman.";
  }, false);
})();
</script>
